name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  java:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [order-service, stream-ingestion]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test ${{ matrix.service }}
        working-directory: services/${{ matrix.service }}
        run: mvn -B verify

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r data-platform/python/requirements-dev.txt
      - run: python -m unittest discover -s data-platform/python/tests -p 'test_*.py'
      - run: python -m compileall data-platform/python/jobs data-platform/glue

  docker:
    runs-on: ubuntu-latest
    needs: [java, python]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose --profile jobs build order-service stream-ingestion spark-job
